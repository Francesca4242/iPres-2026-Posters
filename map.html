<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hall map &middot; iPRES 2026 Poster Hall</title>
<meta name="description" content="A clickable, blocky map of the iPRES 2026 poster hall. Tap a board to read the poster hanging on it.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b82c6'/><circle cx='50' cy='42' r='16' fill='white'/><circle cx='50' cy='42' r='6' fill='%230b82c6'/><path d='M50 58 L64 84 H36 Z' fill='white'/></svg>">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .map-page { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 1.5rem; align-items: start; }
  @media (max-width: 1040px) { .map-page { grid-template-columns: 1fr; } }
  .map-side { position: sticky; top: 86px; display: grid; gap: 1.2rem; }
  @media (max-width: 1040px) { .map-side { position: static; } }
  .map-side .meta-block { margin: 0; }
  .map-preview { border: 3px solid var(--ink); border-radius: var(--radius-sm); overflow: hidden; background: var(--paper-3); aspect-ratio: 4/3; display: grid; place-items: center; }
  .map-preview canvas, .map-preview img { width: 100%; height: 100%; object-fit: contain; }
  .map-preview .placeholder { font-family: var(--display); font-weight: 700; text-align: center;
    padding: 1rem; color: var(--ink-soft); font-size: .85rem; }
  .map-blurb { font-size: .88rem; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header data-site-header></header>

<main id="main" class="wrap-wide">
  <section style="padding:2rem 0 0">
    <h1>Find it in the room</h1>
    <p class="hero__lead">Every board in the hall, colour-coded by theme. Click one to read the poster
      hanging on it &mdash; or pick a trail and watch the route light up.</p>
  </section>

  <div class="banner-note" data-unassigned-note hidden
       style="border-style:solid;border-color:var(--ink);background:var(--paper)"></div>

  <div class="banner-note" data-online-note hidden
       style="border-style:solid;border-color:var(--ink);background:#ffd166;color:#08131c"></div>

  <div class="banner-note" data-provisional hidden>
    <span aria-hidden="true" style="font-size:1.6rem">&#128679;</span>
    <div>
      <b>This layout is provisional.</b>
      <span data-provisional-text></span>
    </div>
  </div>

  <div class="map-page">
    <div class="map-shell">
      <div class="map-shell__bar">
        <label class="visually-hidden" for="map-theme">Highlight a theme</label>
        <select class="filter" id="map-theme" data-needs-assignment hidden
                style="padding:.45rem .8rem"><option value="">All themes</option></select>
        <label class="visually-hidden" for="map-trail">Show a trail</label>
        <select class="filter" id="map-trail" data-needs-assignment hidden
                style="padding:.45rem .8rem"><option value="">No trail</option></select>
        <button class="filter" type="button" data-shuffle>&#127922; Random board</button>
      </div>
      <div class="map-canvas" data-canvas>
        <div class="map-tip" data-tip></div>
      </div>
      <div class="map-legend" data-legend></div>
    </div>

    <aside class="map-side">
      <div class="meta-block" data-detail>
        <h3>Pick a board</h3>
        <p style="color:var(--ink-soft);font-size:.92rem">Hover for a board number, click for
          what is on it.</p>
      </div>
      <div class="passport" data-passport></div>
    </aside>
  </div>

  <!-- The posters that are not in the room. Same blocky styling, but drawn as
       a browser window, because that is where they are. -->
  <section class="online-room" id="online-room" data-online-room hidden></section>

  <div data-poll-banner></div>
</main>

<footer data-site-footer></footer>

<script src="assets/js/site.js"></script>
<script src="assets/js/trails.js"></script>
<script>
(async () => {
  document.querySelector('[data-canvas]').insertAdjacentHTML('beforeend', IPRES.loader('Building the hall'));
  const config = await IPRES.chrome('map.html');
  const { posters, themeList, counts, layout } = await IPRES.hall();
  const esc = IPRES.esc;
  const lookup = IPRES.byId(posters);
  const trails = buildTrails(posters);
  const params = new URLSearchParams(window.location.search);
  const [, , VIEW_W, VIEW_H] = layout.viewBox;

  document.querySelector('[data-poll-banner]').innerHTML = IPRES.pollBanner(config);
  IPRES.wirePollPending();
  IPRES.renderPassport(document.querySelector('[data-passport]'), counts.total);

  const onlinePosters = posters.filter((poster) => poster.presentedOnline);
  onlineRoom(onlinePosters);
  if (onlinePosters.length) {
    document.querySelector('[data-online-note]').innerHTML = `
      <span aria-hidden="true" style="font-size:1.6rem">\u{1F4BB}</span>
      <div><b>${onlinePosters.length} poster${onlinePosters.length === 1 ? ' is' : 's are'}
      presented online</b> and ${onlinePosters.length === 1 ? 'is' : 'are'} not in the hall, so
      ${onlinePosters.length === 1 ? 'it has' : 'they have'} no board here.
      <a href="#online-room">${onlinePosters.length === 1 ? 'It is' : 'They are'} in the
      Online Room below \u2193</a></div>`;
    document.querySelector('[data-online-note]').hidden = false;
  }

  if (layout.provisional) {
    document.querySelector('[data-provisional]').hidden = false;
    document.querySelector('[data-provisional-text]').textContent = ' ' + layout.note;
  }

  /* ---------- draw the hall as a board game ---------- */

  const SVG = 'http://www.w3.org/2000/svg';
  const make = (name, attrs = {}) => {
    const node = document.createElementNS(SVG, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    return node;
  };
  const text = (content, attrs) => {
    const node = make('text', attrs);
    node.textContent = content;
    return node;
  };

  const svg = make('svg', {
    viewBox: layout.viewBox.join(' '),
    role: 'group',
    'aria-label': 'Map of the poster hall',
  });

  const detail = document.querySelector('[data-detail]');
  const tip = document.querySelector('[data-tip]');
  const canvasNode = document.querySelector('[data-canvas]');

  /* ---------- the room, deliberately not to scale ---------- */

  const room = layout.room;

  const floor = make('g');
  floor.appendChild(make('rect', {
    class: 'map-board', x: room.x, y: room.y, width: room.w, height: room.h, rx: 14,
  }));
  /* A one-metre grid, so the plan reads as a measured drawing. */
  const tiles = make('g');
  const TILE = 108;
  for (let row = 0; row * TILE < room.h - 2; row += 1) {
    for (let col = 0; col * TILE < room.w - 2; col += 1) {
      tiles.appendChild(make('rect', {
        class: (row + col) % 2 ? 'map-tile-a' : 'map-tile-b',
        x: room.x + col * TILE + 2, y: room.y + row * TILE + 2,
        width: Math.min(TILE - 4, room.w - col * TILE - 4),
        height: Math.min(TILE - 4, room.h - row * TILE - 4),
        rx: 8,
      }));
    }
  }
  floor.appendChild(tiles);
  svg.appendChild(floor);

  /* Fixed features from the plan. */
  const FURNITURE_ICONS = { stairs: '\u{1FA9C}', survey: '\u{1F4CB}' };
  const FURNITURE_FILLS = { stairs: '#10b981', survey: '#fbbf24' };
  const survey = config.survey || {};
  const furniture = make('g', { class: 'map-furniture' });
  (layout.furniture || []).forEach((item) => {
    const isSurvey = item.kind === 'survey';
    const label = isSurvey ? (survey.name || item.label) : item.label;
    /* Only a block big enough to hold its own caption gets one inside it. */
    const roomy = item.w >= 200;

    const group = make('g', isSurvey ? {
      class: 'furn-link', tabindex: 0, role: 'button',
      'aria-label': `${label}${survey.url ? '' : ' - link coming soon'}`,
    } : {});
    group.appendChild(make('rect', { class: 'furn-shadow', x: item.x + 4, y: item.y + 5, width: item.w, height: item.h, rx: 9 }));
    group.appendChild(make('rect', {
      class: 'furn-face', x: item.x, y: item.y, width: item.w, height: item.h, rx: 9,
      fill: FURNITURE_FILLS[item.kind] || '#cbd5e1',
    }));
    group.appendChild(text(FURNITURE_ICONS[item.kind] || '', {
      class: 'furn-icon', x: item.x + item.w / 2,
      y: item.y + item.h / 2 + (roomy ? -30 : 7), 'text-anchor': 'middle',
    }));
    group.appendChild(text(label, roomy
      ? { x: item.x + item.w / 2, y: item.y + item.h / 2 - 8, 'text-anchor': 'middle' }
      : { x: item.x + item.w / 2, y: item.y + item.h + 19, 'text-anchor': 'middle' }));

    if (isSurvey) {
      const open = () => {
        if (survey.url) { window.open(survey.url, '_blank', 'noopener'); return; }
        detail.innerHTML = `<h3>${esc(label)}</h3>
          <p>${esc(survey.blurb || 'A table by the stairs.')}</p>
          <p><span class="chip chip--awaited">Link coming soon</span></p>`;
      };
      group.addEventListener('click', open);
      group.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); }
      });
      group.addEventListener('mousemove', (event) => {
        const box = canvasNode.getBoundingClientRect();
        tip.innerHTML = `<b>${esc(label)}</b>${survey.url ? 'Open the survey' : 'Link coming soon'}`;
        tip.classList.add('is-on');
        tip.style.left = `${Math.max(4, Math.min(event.clientX - box.left + 14, box.width - 270))}px`;
        tip.style.top = `${event.clientY - box.top + 14}px`;
      });
      group.addEventListener('mouseleave', () => tip.classList.remove('is-on'));
    }
    furniture.appendChild(group);
  });
  svg.appendChild(furniture);

  /* Board 1 is the one by the stairs, so plant a flag where people come up. */
  const stairs = (layout.furniture || []).find((f) => f.kind === 'stairs');
  if (stairs) {
    const flag = make('g', { class: 'map-startflag' });
    const cx = stairs.x + stairs.w / 2;

    /* A proper flagpole standing on the staircase, left of its caption. */
    const fx = stairs.x + 22;
    const fy = stairs.y + stairs.h - 14;
    flag.appendChild(make('line', { class: 'flag-pole', x1: fx, y1: fy, x2: fx, y2: fy - 120 }));
    flag.appendChild(make('path', {
      class: 'flag-cloth',
      d: `M${fx} ${fy - 120} C${fx + 26} ${fy - 112} ${fx + 38} ${fy - 96} ${fx + 62} ${fy - 100}
          C${fx + 46} ${fy - 82} ${fx + 36} ${fy - 62} ${fx} ${fy - 70} Z`,
    }));

    /* ...and a banner big enough to read at a glance. */
    const bw = 300;
    const bh = 68;
    const bx = cx - bw / 2 + 18;
    const by = stairs.y + stairs.h - 82;
    flag.appendChild(make('rect', {
      class: 'flag-banner-shadow', x: bx + 4, y: by + 5, width: bw, height: bh, rx: bh / 2,
    }));
    flag.appendChild(make('rect', {
      class: 'flag-banner', x: bx, y: by, width: bw, height: bh, rx: bh / 2,
    }));
    flag.appendChild(text('Start here', {
      class: 'flag-banner-text', x: bx + bw / 2, y: by + bh / 2 + 12, 'text-anchor': 'middle',
    }));

    svg.appendChild(flag);
  }

  /* Trail route sits under the boards so the tiles stay clickable. */
  const trailUnder = make('path', { class: 'map-trail-under' });
  const trailPath = make('path', { class: 'map-trail' });
  svg.appendChild(trailUnder);
  svg.appendChild(trailPath);

  const slotNodes = new Map();
  const slotPoints = new Map();

  /* A board with no poster on it is worth showing while the hall is being
     filled in - it says "this board exists and is still free". Once every
     poster that is in the room has a board, the ones left over are boards the
     conference simply is not using, and they only get in the way, so they come
     off the map. `map.hideEmptyBoards` in data/config.json forces it either way
     ("auto" is the default behaviour just described). */
  const inRoom = posters.filter((poster) => poster.presentedOnline !== true);
  const seated = inRoom.filter((poster) => poster.slot).length;
  const hideSetting = (config.map || {}).hideEmptyBoards;
  const hideEmpty = hideSetting === true ? true
    : hideSetting === false ? false
      : seated > 0 && seated === inRoom.length;

  /* Walls are a flat list: a run stands out from the long wall with a board on
     each face, a flat one lies along it with a single board. Groups are not
     named on the map - the numbers are what people use. */
  const wallsGroup = make('g');
  layout.walls.forEach((wall) => {
    const thick = Math.max(wall.thickness, 7);
    /* A flat board sits on the edge of the room, so nudge it inside or it
       vanishes into the outline. */
    const inset = wall.kind === 'flat'
      ? (wall.y1 <= room.y + 1 ? thick / 2 : -thick / 2)
      : 0;
    const geom = {
      x1: wall.x1, y1: wall.y1 + inset, x2: wall.x2, y2: wall.y2 + inset,
      'stroke-width': thick, 'stroke-linecap': 'round',
    };
    wallsGroup.appendChild(make('line', { ...geom, class: 'map-wall-shadow',
      x1: geom.x1 + 3, y1: geom.y1 + 4, x2: geom.x2 + 3, y2: geom.y2 + 4 }));
    wallsGroup.appendChild(make('line', { ...geom, class: 'map-wall' }));

    wall.slots.forEach((slot) => {
      const poster = slot.poster ? lookup[slot.poster] : null;
      if (!poster && hideEmpty) return;
      const theme = poster && poster.themeObjects[0];
      const node = make('g', {
        class: 'map-slot' + (poster ? '' : ' map-slot--free'),
        tabindex: 0, role: 'button',
        'data-slot': slot.id,
        'aria-label': poster
          ? `Board ${slot.number}: ${poster.title}`
          : `Board ${slot.number}, no poster assigned yet`,
      });
      const w = 80;
      const h = 64;
      const x = slot.x - w / 2;
      const y = slot.y - h / 2;
      const lift = make('g', { class: 'slot-lift' });
      lift.appendChild(make('rect', { class: 'slot-shadow', x: x + 3, y: y + 3, width: w, height: h, rx: 7 }));
      lift.appendChild(make('rect', {
        class: 'slot-face', x, y, width: w, height: h, rx: 7,
        fill: theme ? theme.color : 'var(--board-empty)',
      }));
      lift.appendChild(make('rect', { class: 'slot-shine', x: x + 3, y: y + 3, width: w - 6, height: 6, rx: 3 }));
      lift.appendChild(text(slot.number, { x: x + w / 2, y: y + h / 2 + 6, 'text-anchor': 'middle' }));
      node.appendChild(lift);
      wallsGroup.appendChild(node);
      slotNodes.set(slot.id, { node, lift, slot, poster, wall });
      if (slot.poster) slotPoints.set(slot.poster, [slot.x, slot.y]);
    });
  });
  svg.appendChild(wallsGroup);

  const canvas = canvasNode;
  canvas.querySelector('.bike-loader')?.remove();
  canvas.appendChild(svg);


  /* ---------- legend ---------- */

  const assigned = [...slotNodes.values()].filter((entry) => entry.poster).length;

  document.querySelector('[data-legend]').innerHTML = (assigned
    ? [
      ...themeList.map((theme) =>
        `<span class="chip chip--solid" style="background:${theme.color}">${theme.emoji} ${esc(theme.short)}</span>`),
      ...(hideEmpty
        ? [`<span class="chip chip--plain">${assigned} posters on the wall</span>`]
        : ['<span class="chip chip--plain">Grey = board still free</span>']),
      '<span class="chip chip--plain">Green outline = you have seen it</span>',
    ]
    : [
      `<span class="chip chip--plain">${layout.counts.walls} walls &middot; ${layout.counts.slots} boards</span>`,
      '<span class="chip chip--plain">Double walls carry a poster each side</span>',
      '<span class="chip chip--plain">\u{1F6A9} Board 1 is by the stairs</span>',
      '<span class="chip chip--plain">Not to scale</span>',
    ]).join('');

  /* Filtering by theme or walking a trail needs posters on boards. Until they
     are assigned those controls would do nothing, so they stay hidden. */
  document.querySelectorAll('[data-needs-assignment]').forEach((node) => {
    node.hidden = !assigned;
  });
  if (!assigned) {
    document.querySelector('[data-unassigned-note]').hidden = false;
    document.querySelector('[data-unassigned-note]').innerHTML = `
      <span aria-hidden="true" style="font-size:1.6rem">\u{1F4CC}</span>
      <div><b>The boards are numbered but empty.</b> ${esc(layout.counts.slots)} boards
      across ${esc(layout.counts.walls)} walls, in the order you will walk past them.
      Which poster goes on which board has not been decided yet.</div>`;
  }

  /* ---------- the online room ---------- */

  /* Posters presented online have no board, which on a map page can read as
     "not really here". They get their own room instead: the same blocky
     styling, drawn as a browser window, sitting under the floor plan where
     anybody planning their walk will see it. */
  function onlineRoom(list) {
    const room = document.querySelector('[data-online-room]');
    if (!list.length) return;
    const site = (config.conference || {}).website || 'https://ipres2026.dk/';
    const host = site.replace(/^https?:\/\//, '').replace(/\/$/, '');
    const cards = list.map((poster) => `
      <a class="online-card" href="poster.html?id=${encodeURIComponent(poster.id)}">
        ${IPRES.thumbnailFor(poster, 'online-card__thumb')}
        <div class="online-card__body">
          <h3 class="online-card__title">${esc(poster.title)}</h3>
          <p class="online-card__authors">${esc(poster.authorLine)}</p>
          <div class="online-card__foot">
            ${(poster.themeObjects || []).slice(0, 2).map((theme) =>
              `<span class="chip chip--solid" style="background:${theme.color}">${theme.emoji} ${esc(theme.short)}</span>`).join('')}
            <span class="online-card__go">Open \u2192</span>
          </div>
        </div>
      </a>`).join('');

    room.innerHTML = `
      <div class="browser">
        <div class="browser__bar">
          <span class="browser__dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="browser__tab">\u{1F310} The Online Room</span>
          <span class="browser__url"><span aria-hidden="true">\u{1F512}</span>
            ${esc(host)}/online-room<span class="browser__caret" aria-hidden="true"></span></span>
        </div>
        <div class="browser__screen">
          <h2 class="browser__hello">Beamed in from elsewhere</h2>
          <p class="browser__sub">${list.length} poster${list.length === 1 ? '' : 's'}
            ${list.length === 1 ? 'is' : 'are'} presented online, so ${list.length === 1 ? 'it has' : 'they have'}
            no board in the foyer. ${list.length === 1 ? 'It is' : 'They are'} every bit as
            readable from here &mdash; no stairs, no queue.</p>
          <div class="online-grid">${cards}</div>
        </div>
        <div class="browser__status">
          <span class="browser__live" aria-hidden="true"></span>
          Connected &middot; ${list.length} online &middot; open all night
        </div>
      </div>`;
    room.hidden = false;
    IPRES.thumbnails(room);
  }

  /* ---------- side panel ---------- */

  function showSlot(entry) {
    const { slot, poster, wall, lift } = entry;
    lift.classList.remove('map-slot--hit');
    void lift.getBoundingClientRect();  // force a reflow so the pop replays
    lift.classList.add('map-slot--hit');

    if (!poster) {
      detail.innerHTML = `<h3>Board #${slot.number}</h3>
        <p>No poster on this board yet.</p>
        <p style="font-size:.85rem;color:var(--ink-soft)">${esc(wall.hint || '')}</p>`;
      return;
    }
    const seen = IPRES.passport.has(poster.id);
    detail.innerHTML = `
      <div class="poster-card__foot" style="margin-bottom:.7rem">
        <span class="chip chip--solid" style="background:var(--ink)">Board #${slot.number}</span>
        ${poster.themeObjects.map((theme) =>
          `<span class="chip chip--solid" style="background:${theme.color}">${theme.emoji} ${esc(theme.short)}</span>`).join('')}
      </div>
      ${IPRES.thumbnailFor(poster, 'map-preview')}
      <h3 style="margin-top:.9rem">${esc(poster.title)}</h3>
      <p style="font-size:.88rem;color:var(--ink-soft)">${esc(poster.authorLine)}</p>
      <p class="map-blurb">${esc(poster.abstract)}</p>
      <p style="font-size:.8rem;color:var(--ink-soft)">${esc(wall.hint || '')}</p>
      <div class="poster-card__foot">
        <a class="btn btn--sm btn--primary" href="poster.html?id=${encodeURIComponent(poster.id)}">Read the poster</a>
        <button class="btn btn--sm" type="button" data-seen>${seen ? '✓ Seen it' : 'Mark as seen'}</button>
      </div>`;
    IPRES.thumbnails(detail);
    const seenButton = detail.querySelector('[data-seen]');
    if (seenButton) {
      seenButton.addEventListener('click', () => {
        const now = IPRES.passport.toggle(poster.id);
        seenButton.textContent = now ? '✓ Seen it' : 'Mark as seen';
      });
    }
  }

  slotNodes.forEach((entry) => {
    const { node, slot, poster } = entry;
    const open = () => showSlot(entry);
    node.addEventListener('click', open);
    node.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); }
    });
    node.addEventListener('focus', open);
    node.addEventListener('mousemove', (event) => {
      const box = canvas.getBoundingClientRect();
      const title = poster ? poster.title : 'No poster assigned yet';
      tip.innerHTML = `<b>Board #${slot.number}</b>${esc(title)}`;
      tip.classList.add('is-on');
      tip.style.left = `${Math.max(4, Math.min(event.clientX - box.left + 14, box.width - 270))}px`;
      tip.style.top = `${event.clientY - box.top + 14}px`;
    });
    node.addEventListener('mouseleave', () => tip.classList.remove('is-on'));
  });

  /* ---------- filters, trails and deep links ---------- */

  const themeSelect = document.getElementById('map-theme');
  themeSelect.insertAdjacentHTML('beforeend', themeList.map((theme) =>
    `<option value="${theme.id}">${theme.emoji} ${esc(theme.name)}</option>`).join(''));

  const trailSelect = document.getElementById('map-trail');
  trailSelect.insertAdjacentHTML('beforeend', trails.map((trail) =>
    `<option value="${trail.id}">${trail.emoji} ${esc(trail.name)} (${trail.stops.length})</option>`).join(''));

  function applyHighlight() {
    const themeId = themeSelect.value;
    const trail = trails.find((t) => t.id === trailSelect.value);
    const onTrail = trail ? new Set(trail.stops.map((s) => s.id)) : null;
    const seen = IPRES.passport.seen();

    slotNodes.forEach(({ node, poster }) => {
      let dim = false;
      if (themeId && !(poster && poster.themes.includes(themeId))) dim = true;
      if (onTrail && !(poster && onTrail.has(poster.id))) dim = true;
      node.classList.toggle('map-slot--dim', dim);
      node.classList.toggle('map-slot--seen', !!(poster && seen.has(poster.id)));
    });

    const route = trail
      ? trail.stops.map((stop) => slotPoints.get(stop.id)).filter(Boolean)
        .map((point, index) => `${index ? 'L' : 'M'}${point[0]} ${point[1]}`).join(' ')
      : '';
    trailPath.setAttribute('d', route);
    trailUnder.setAttribute('d', route);
    if (trail) trailPath.style.setProperty('--trail-color', trail.color);
  }

  themeSelect.addEventListener('change', applyHighlight);
  trailSelect.addEventListener('change', applyHighlight);
  document.addEventListener('passport:change', applyHighlight);

  document.querySelector('[data-shuffle]').addEventListener('click', () => {
    const entries = [...slotNodes.values()];
    const withPosters = entries.filter((entry) => entry.poster);
    const pool = withPosters.length ? withPosters : entries;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    pick.node.focus();
    showSlot(pick);
  });

  if (params.get('trail')) trailSelect.value = params.get('trail');
  if (params.get('theme')) themeSelect.value = params.get('theme');
  applyHighlight();

  const wantedPoster = params.get('poster');
  if (wantedPoster) {
    const entry = [...slotNodes.values()].find((item) => item.poster && item.poster.id === wantedPoster);
    if (entry) {
      entry.node.focus();
      showSlot(entry);
    } else {
      /* Someone followed a link to a poster that has no board - it is either
         presented online or not placed yet. Say which, rather than nothing. */
      const poster = lookup[wantedPoster];
      detail.innerHTML = poster
        ? `<h3>${esc(poster.title)}</h3>
           <p>${poster.presentedOnline
             ? '<span class="chip chip--online">\u{1F4BB} Online</span></p><p>This one is presented online, so it has no board in the hall.'
             : 'This poster does not have a board yet.'}</p>
           <p><a class="btn btn--sm btn--primary" href="poster.html?id=${encodeURIComponent(poster.id)}">Read it here</a></p>`
        : '<h3>Not found</h3><p>No poster with that id. <a href="posters.html">Browse them all</a>.</p>';
    }
  }
})();
</script>
</body>
</html>
