<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poster &middot; iPRES 2026 Poster Hall</title>
<meta name="description" content="Read an iPRES 2026 poster with its full abstract, authors and topics.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b82c6'/><rect x='24' y='18' width='52' height='64' rx='5' fill='white'/><rect x='32' y='28' width='36' height='6' fill='%230b82c6'/><rect x='32' y='42' width='36' height='4' fill='%23cfdde8'/><rect x='32' y='52' width='28' height='4' fill='%23cfdde8'/><rect x='32' y='62' width='34' height='4' fill='%23cfdde8'/></svg>">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header data-site-header></header>

<main id="main" class="wrap-wide">
  <nav aria-label="Breadcrumb" style="padding-top:1.2rem;font-size:.9rem">
    <a href="posters.html">&larr; All posters</a>
  </nav>
  <div class="poster-layout" data-layout hidden>
    <div>
      <div class="viewer">
        <div class="viewer__bar" data-viewer-bar></div>
        <div class="viewer__stage" data-stage></div>
      </div>
    </div>
    <div data-sidebar></div>
  </div>
  <div data-missing hidden class="empty-state">
    <div class="big">&#128269;</div>
    <h2>That poster is not here</h2>
    <p>It may have been renamed. <a href="posters.html">Browse the full list</a> instead.</p>
  </div>
</main>

<footer data-site-footer></footer>

<script src="assets/js/site.js"></script>
<script src="assets/js/trails.js"></script>
<script>
(async () => {
  document.querySelector('[data-stage]').innerHTML = IPRES.loader('Fetching the poster');
  const config = await IPRES.chrome('');
  const { posters, themes } = await IPRES.hall();
  const wanted = new URLSearchParams(window.location.search).get('id');
  const poster = posters.find((p) => p.id === wanted);

  if (!poster) {
    document.querySelector('[data-missing]').hidden = false;
    return;
  }
  document.querySelector('[data-layout]').hidden = false;
  document.title = `${poster.title} · iPRES 2026 Poster Hall`;
  const description = document.querySelector('meta[name="description"]');
  if (description) description.content = `${poster.title} - an iPRES 2026 poster by ${poster.authorLine}.`;

  /* Share links (Slack, Mastodon, email previews) show the poster itself. */
  const meta = (attr, key, value) => {
    const node = document.createElement('meta');
    node.setAttribute(attr, key);
    node.content = value;
    document.head.appendChild(node);
  };
  meta('property', 'og:title', poster.title);
  meta('property', 'og:description', `An iPRES 2026 poster by ${poster.authorLine}.`);
  meta('property', 'og:type', 'article');
  meta('property', 'og:url', window.location.href);
  meta('name', 'twitter:card', poster.thumb ? 'summary_large_image' : 'summary');
  if (poster.thumb) meta('property', 'og:image', new URL(poster.thumb, window.location.href).href);

  const esc = IPRES.esc;
  const trails = buildTrails(posters).filter((trail) => trail.stops.some((s) => s.id === poster.id));
  const related = posters
    .filter((other) => other.id !== poster.id && other.themes.some((t) => poster.themes.includes(t)))
    .slice(0, 4);

  /* ---------- sidebar ---------- */

  const affiliationFor = (author) => (author.affiliations || [])
    .map((index) => poster.organisations[Number(index) - 1])
    .filter(Boolean).join('; ');

  const slotLine = poster.presentedOnline
    ? `<dt>Where to find it</dt><dd>Presented <strong>online</strong>, so there is no board
         for it in the hall &mdash; this page is where to read it.</dd>`
    : poster.slot
      ? `<dt>Where to find it</dt><dd>Board <strong>#${poster.slot.number}</strong>
           &middot; <a href="map.html?poster=${encodeURIComponent(poster.id)}">show me on the map</a>
           <br><small>Positions are provisional until the hall is set up.</small></dd>`
      : '';

  document.querySelector('[data-sidebar]').innerHTML = `
    <article class="meta-block">
      <div class="poster-card__foot" style="margin-bottom:.8rem">
        ${poster.themeObjects.map((theme) =>
          `<a class="chip chip--solid" style="background:${theme.color}" href="posters.html?theme=${theme.id}">${theme.emoji} ${esc(theme.short)}</a>`).join('')}
        ${poster.status === 'awaited' ? '<span class="chip chip--awaited">PDF coming soon</span>' : ''}
        ${poster.presentedOnline ? '<span class="chip chip--online">\u{1F4BB} Online</span>' : ''}
      </div>
      <h2>${esc(poster.title)}</h2>
      <dl class="meta-list">
        <div>
          <dt>Authors</dt>
          <dd>${poster.authors.map((author) => {
            const affiliation = affiliationFor(author);
            return `<div><strong>${esc(author.name)}</strong>${affiliation ? `<br><small>${esc(affiliation)}</small>` : ''}</div>`;
          }).join('')}</dd>
        </div>
        ${poster.authors.every((a) => !(a.affiliations || []).length) && poster.organisations.length
          ? `<div><dt>Institution</dt><dd>${poster.organisations.map(esc).join('<br>')}</dd></div>` : ''}
        ${slotLine ? `<div>${slotLine}</div>` : ''}

      </dl>
      <div class="poster-card__foot" style="margin-top:1.1rem;gap:.6rem">
        <button class="btn btn--sm" type="button" data-seen></button>
        ${IPRES.pollButton(config, 'btn--sm', 'Vote for this poster')}
      </div>
    </article>

    <article class="meta-block">
      <h3>Abstract</h3>
      <div class="abstract">${poster.abstract.split('\n').filter(Boolean).map((para) => `<p>${esc(para)}</p>`).join('') || '<p>No abstract supplied.</p>'}</div>
    </article>

    <article class="meta-block">
      <h3>Keywords &amp; topics</h3>
      <div class="poster-card__foot" style="gap:.4rem">
        ${poster.keywords.map((keyword) =>
          `<a class="chip chip--plain" href="posters.html?q=${encodeURIComponent(keyword)}">${esc(keyword)}</a>`).join('')}
      </div>
      <p style="margin:.9rem 0 0;font-size:.85rem;color:var(--ink-soft)">
        Submitted under: ${poster.topics.map(esc).join(' &middot; ') || 'no topics given'}</p>
    </article>

    ${trails.length ? `<article class="meta-block">
      <h3>On these trails</h3>
      <div class="neighbours">
        ${trails.map((trail) => `<a class="neighbour" href="trails.html#trail-${trail.id}">
          <span style="font-size:1.4rem">${trail.emoji}</span>
          <span><b>${esc(trail.name)}</b><span>${trail.stops.length} stops</span></span></a>`).join('')}
      </div>
    </article>` : ''}

    ${related.length ? `<article class="meta-block">
      <h3>If you liked this one</h3>
      <div class="neighbours">
        ${related.map((other) => `<a class="neighbour" href="poster.html?id=${encodeURIComponent(other.id)}">
          <span style="font-size:1.4rem">${(other.themeObjects[0] || {}).emoji || '\u{1F4C4}'}</span>
          <span><b>${esc(other.title)}</b><span>${esc(other.authorLine)}</span></span></a>`).join('')}
      </div>
    </article>` : ''}`;

  const seenButton = document.querySelector('[data-seen]');
  const drawSeen = () => {
    const seen = IPRES.passport.has(poster.id);
    seenButton.textContent = seen ? '✓ Seen it' : 'Mark as seen';
    seenButton.classList.toggle('btn--primary', seen);
  };
  seenButton.addEventListener('click', () => { IPRES.passport.toggle(poster.id); drawSeen(); });
  drawSeen();
  IPRES.wirePollPending();

  /* ---------- the PDF viewer ---------- */

  const stage = document.querySelector('[data-stage]');
  const bar = document.querySelector('[data-viewer-bar]');

  if (!poster.file) {
    bar.innerHTML = '<strong>Poster PDF</strong>';
    stage.innerHTML = `<div class="viewer__msg">
      <p style="font-size:2.5rem;margin:0">&#128236;</p>
      <p><strong>This poster has not arrived yet.</strong></p>
      <p>The abstract is here already - the PDF will appear on this page as soon as the authors send it.</p></div>`;
    return;
  }

  const view = { page: 1, pages: 1, zoom: 1, fitWidth: true, doc: null, fitPx: 0 };
  const ZOOM_STEPS = [0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3, 4];

  const drawBar = () => {
    bar.innerHTML = `
      <button class="btn btn--sm" type="button" data-prev aria-label="Previous page">&#9664;</button>
      <span style="font-family:var(--display);font-size:.85rem">Page ${view.page} / ${view.pages}</span>
      <button class="btn btn--sm" type="button" data-next aria-label="Next page">&#9654;</button>
      <span class="spacer"></span>
      <button class="btn btn--sm" type="button" data-zoom="-1" aria-label="Zoom out"
        ${view.zoom <= ZOOM_STEPS[0] ? 'disabled' : ''}>&minus;</button>
      <button class="btn btn--sm" type="button" data-fit>${view.fitWidth
        ? 'Fit' : `${Math.round(view.zoom * 100)}%`}</button>
      <button class="btn btn--sm" type="button" data-zoom="1" aria-label="Zoom in"
        ${view.zoom >= ZOOM_STEPS[ZOOM_STEPS.length - 1] ? 'disabled' : ''}>+</button>
      <a class="btn btn--sm" href="${esc(poster.file)}" target="_blank" rel="noopener">Open PDF</a>
      <a class="btn btn--sm" href="${esc(poster.file)}" download>Download</a>`;
    bar.querySelector('[data-prev]').addEventListener('click', () => go(view.page - 1));
    bar.querySelector('[data-next]').addEventListener('click', () => go(view.page + 1));
    bar.querySelector('[data-fit]').addEventListener('click', () => { view.fitWidth = true; view.zoom = 1; paint(); });
    bar.querySelectorAll('[data-zoom]').forEach((button) => button.addEventListener('click', () => {
      const direction = Number(button.dataset.zoom);
      const next = direction > 0
        ? ZOOM_STEPS.find((step) => step > view.zoom + 0.001)
        : [...ZOOM_STEPS].reverse().find((step) => step < view.zoom - 0.001);
      if (next === undefined) return;
      view.fitWidth = false;
      view.zoom = next;
      paint();
    }));
  };

  const go = (page) => {
    view.page = Math.min(view.pages, Math.max(1, page));
    paint();
  };

  let canvas;
  async function paint() {
    if (!view.doc) return;
    /* Zoom is measured against the width that fits the stage, captured while
       the page still fits. Using the live clientWidth would shrink the base
       as soon as a scrollbar appeared, so zooming in would creep. */
    if (view.fitWidth || !view.fitPx) {
      view.fitPx = Math.max(280, (stage.clientWidth || 700) - 32);
    }
    /* Redraw the controls before rasterising, not after: a big poster takes a
       moment, and the buttons should show what you just asked for straight
       away rather than lagging a page behind. */
    drawBar();
    const width = view.fitWidth ? view.fitPx : view.fitPx * view.zoom;
    stage.classList.add('is-rendering');
    try {
      await IPRES.renderPage(view.doc, view.page, canvas, Math.max(280, width));
    } finally {
      stage.classList.remove('is-rendering');
    }
  }

  /* The thumbnail is already a few tens of KB and cached from the gallery, so
     show the poster immediately instead of a spinner while the PDF arrives. */
  if (poster.thumb) {
    stage.innerHTML = `<img class="viewer__preview" src="${esc(poster.thumb)}"
      alt="First page of ${esc(poster.title)}">${IPRES.loader('Fetching the full poster')}`;
  }

  try {
    view.doc = await IPRES.openPdf(poster.file);
    view.pages = view.doc.numPages;
    canvas = document.createElement('canvas');
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', `Poster: ${poster.title}`);
    stage.replaceChildren(canvas);
    await paint();
    window.addEventListener('resize', () => { if (view.fitWidth) paint(); });
    document.addEventListener('keydown', (event) => {
      if (event.target.matches('input, textarea, select')) return;
      if (event.key === 'ArrowRight') go(view.page + 1);
      if (event.key === 'ArrowLeft') go(view.page - 1);
      if (event.key === '+' || event.key === '=') bar.querySelector('[data-zoom="1"]')?.click();
      if (event.key === '-') bar.querySelector('[data-zoom="-1"]')?.click();
      if (event.key === '0') bar.querySelector('[data-fit]')?.click();
    });
  } catch (err) {
    /* pdf.js blocked or offline: fall back to the browser's own PDF plugin. */
    bar.innerHTML = `<strong style="font-family:var(--display)">Poster PDF</strong><span class="spacer"></span>
      <a class="btn btn--sm" href="${esc(poster.file)}" target="_blank" rel="noopener">Open PDF</a>
      <a class="btn btn--sm" href="${esc(poster.file)}" download>Download</a>`;
    stage.innerHTML = `<iframe src="${esc(poster.file)}" title="Poster: ${esc(poster.title)}"></iframe>`;
  }
})();
</script>
</body>
</html>
